function scaleNodesTo(arr,totalMb){
  const base=arr.reduce((a,n)=>a+n.mb,0);
  if(!base || !totalMb) return arr;
  const k=totalMb/base;
  if(Math.abs(k-1)<0.001) return arr;
  const walk=(nodes,fn)=>{ for(const n of nodes){ fn(n); walk(n.children||[],fn); } };
  walk(arr,n=>{ n.mb=Math.max(0,Math.round(n.mb*k)); });
  return arr;
}

const demoQr = {
  encodeSvg(text) {
    if (typeof window.qrcode !== 'function') return '';
    const q = window.qrcode(0, 'M');
    q.addData(text);
    q.make();
    return q.createSvgTag({ cellSize: 3, margin: 2, scalable: true });
  },
  async scan({ video, canvas, onResult, onError }) {
    if (!navigator.mediaDevices?.getUserMedia || typeof window.jsQR !== 'function') {
      onError?.('相机或二维码解码不可用');
      return () => {};
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    } catch (err) {
      onError?.('相机不可用：' + (err?.message || '权限被拒绝'));
      return () => {};
    }
    video.srcObject = stream;
    await video.play().catch(() => {});
    let stopped = false;
    let raf = 0;
    const stop = () => {
      stopped = true;
      cancelAnimationFrame(raf);
      try { stream.getTracks().forEach((t) => t.stop()); } catch { /* 已停止 */ }
      video.srcObject = null;
    };
    const tick = () => {
      if (stopped) return;
      if (video.readyState >= 2) {
        const w = video.videoWidth;
        const h = video.videoHeight;
        if (w && h) {
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(video, 0, 0, w, h);
          const img = ctx.getImageData(0, 0, w, h);
          const hit = window.jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
          if (hit?.data) { stop(); onResult(hit.data); return; }
        }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return stop;
  },
};

  generate() {
    const targets = demoTargets();
    if (!targets.length) { view.toast('先在数据包区勾选要发送的包'); return; }
    const code = 'SZC1.z.DEMO-OFFER-' + Math.random().toString(36).slice(2, 8).toUpperCase();

  },
  applyAnswer(code) {
    if (!/^SZC1\./.test(code)) { view.toast('不是应答码'); return; }
    view.setLan({ send: { answer: code, busy: true, phase: '发送中', pct: 0 } });
    let pct = 0;
    const timer = setInterval(() => {
      pct = Math.min(100, pct + 12);
      view.setLan({ send: { pct, phase: pct < 100 ? '发送中' : '已发送', detail: pct < 100 ? ('已发送 ' + pct + '%') : '等待对端核对' } });
      if (pct >= 100) {
        clearInterval(timer);
        view.setLan({ send: { busy: false, done: true, phase: '已发送', pct: 100, detail: '摘要一致' } });
        view.pushLog('INFO', '已发送');
      }
    }, 350);
    demoTimers.push(timer);
  },
  acceptOffer(code) {
    if (!/^SZC1\./.test(code)) { view.toast('不是取件码'); return; }
    const answer = 'SZC1.z.DEMO-ANSWER-' + Math.random().toString(36).slice(2, 8).toUpperCase();
    view.setLan({ recv: { offer: code, code: answer, phase: '把应答码交给对方', pct: 0, detail: '', busy: true, done: false } });
    const timer = setInterval(() => {
      const pct = Math.min(100, (view.getLan().recv.pct || 0) + 10);
      view.setLan({ recv: { pct, phase: pct < 100 ? '接收中' : '已接收', detail: pct < 100 ? ('已接收 ' + pct + '%') : '摘要一致' } });
      if (pct >= 100) {
        clearInterval(timer);
        view.setLan({ recv: { busy: false, done: true, pct: 100, phase: '已接收 · 摘要一致' } });
        const id = 'lan-' + Date.now();
        const st = S();
        const name = 'lan-received-' + Date.now() + '.zip';
        st.packages.unshift({
          id, zone: 'import', host: 'unknown', name, size: '3.0 MB', mb: 3,

        });
        st.selectedPkgs.add(id);
        view.setPackages(st.packages);
        view.toast('已接收并加入导入区');
      }
    }, 400);
    demoTimers.push(timer);
  },
  cancel() { clearDemoTimers(); view.setLan({ send: { busy: false, phase: '已取消', pct: 0 } }); },
  retry() { demoLan.generate(); },
  abandon() { clearDemoTimers(); view.setLan({ recv: { busy: false, phase: '半成品已放弃', pct: 0, code: '' } }); },
};

    settings: () => view.toast('演示模式：设置弹窗由运行时控制器提供'),
    close: () => view.toast('演示模式：关闭按钮在真实插件中关闭面板'),
    onTargetChange: (t) => view.pushLog('INFO','目标平台切换为 '+t),
  }
});
const S = () => view.getState();

function trafficConfirm(onConfirm){
  if(S().noTrafficPrompt){ onConfirm(); return; }
  view.openModal('该操作会耗费大量流量','向后端酒馆上传或下载会消耗大量流量，请确认当前网络环境。',[
    '<label class="check"><input type="checkbox" id="traffic-nodisplay"> 不再显示</label>'
  ],[
    {label:'取消',onClick:view.closeModal},
    {label:'继续',primary:true,onClick:()=>{
      const cb=document.getElementById('traffic-nodisplay');
      if(cb && cb.checked){ S().noTrafficPrompt=true; view.pushLog('INFO','已关闭流量提示'); }
      view.closeModal(); onConfirm();
    }}
  ]);
}

function doFetch(){
  const st=S();
  view.pushLog('INFO','向宿主 '+hostName(st.host)+' 请求数据包');
  const id='p'+Date.now();
  const name=hostName(st.host)+'_host-export_'+dtNow()+'.zip';
  st.packages.push({ id, zone:'import', host:st.host, name, size:'1.2 GB', mb:1200, ts:Date.now(), time:'10-26 '+nowTime().slice(0,5), origin:'本地导入', nodes:scaleNodesTo(demoTree(),1200) });
  view.pushLog('INFO','宿主拉取完成: '+name);
  view.pushLog('INFO','宿主存储读数已加载 · '+hostName(st.host));
  view.renderAll(); view.toast('宿主拉取完成');
}

function doGenerate({ packages, target, splitMb }){
  const st=S();
  if(!packages.length){ view.toast('先选择要导出的包'); return; }
  const bad=packages.find(p=>p.unrecognized);
  if(bad){ view.toast('未识别包只允许存储或导出，不提供转换'); return; }
  const targetKey = target==='SillyTavern' ? 'st' : target==='Luker' ? 'luker' : target==='TauriTavern' ? 'tt' : 'pt';
  const dt=dtNow(), stamp=Date.now(), t='10-26 '+nowTime().slice(0,5);
  const made=[];
  packages.forEach((pkg,pi)=>{
    const vols=view.getVolumes(pkg);
    vols.forEach((v,i)=>{
      made.push({
        id:'e'+stamp+'_'+pi+'_'+i, zone:'export', host:targetKey,
        name:target+'_default-user_part'+(i+1)+'_'+dt+'.zip',
        size:fmtMB(v.mb), mb:Math.round(v.mb), ts:stamp+i,
        time:t, origin:'导出副本', readonly:true
      });
    });
    view.pushLog('INFO','生成导出包: '+pkg.name+' → '+vols.length+' 个');
  });
  st.packages.push(...made);
  view.pushLog('INFO','已生成导出副本（解耦）共 '+made.length+' 个');
  st.zone='export'; st.selectedPkgs=new Set(made.map(m=>m.id));
  view.renderAll();
  view.setProgress(100,'导出包已就绪');
  view.toast('已生成 '+made.length+' 个导出包');
}

function doRestore(ids){
  if(!ids.length){ view.toast('先选择要回传的包'); return; }
  trafficConfirm(()=>{
    view.pushLog('INFO','向宿主 '+hostName(S().host)+' 上传 '+ids.length+' 个包');
    view.toast('已开始上传到宿主');
  });
}

function doCopyBack(ids){
  const st=S();
  let n=0;
  for(const id of ids){
    const pkg=st.packages.find(p=>p.id===id);
    if(!pkg || pkg.zone!=='export') continue;
    st.packages.push({...pkg, id:'p'+Date.now()+'_'+n, zone:'import', origin:'本地导入', readonly:false, ts:Date.now(), time:'10-26 '+nowTime().slice(0,5)});
    n++;
  }
  view.pushLog('INFO','已复制 '+n+' 个包回导入区');
  st.zone='import'; st.selectedPkgs=new Set();
  view.renderAll(); view.toast('已复制回导入区');
}

function doDeleteSelected(ids){
  const st=S();
  if(!ids.length){ view.toast('先选择要删除的包'); return; }
  view.openModal('删除数据包','确定删除选中的 '+ids.length+' 个包吗？此操作不可撤销。',[],[
    {label:'取消',onClick:view.closeModal},
    {label:'删除',primary:true,danger:true,onClick:()=>{
      st.packages=st.packages.filter(p=>!ids.includes(p.id));
      st.selectedPkgs=new Set();
      if(st.source.type==='package' && ids.includes(st.source.pkgId)){
        st.source={type:'host',pkgId:null}; st.sourceKey='host:'+st.host;
      }
      view.pushLog('INFO','已删除 '+ids.length+' 个包');
      view.closeModal(); view.renderAll(); view.toast('已删除');
    }}
  ]);
}

function doUploadPrivate(name){
  trafficConfirm(()=>{
    view.pushLog('INFO','上传私有配置到宿主文件: '+name);
    view.toast('私有配置已上传到 user/files');
  });
}

  const st=S();
  st.selectedPkgs=new Set(); st.expanded={}; st.collapsedVol={}; st.sel={}; st.log=[];
  st.zone='import'; st.source={type:'host',pkgId:null}; st.sourceKey='host:luker';
  st.target='SillyTavern'; st.delta='overwrite'; st.splitMb='';
  st.host='luker'; st.mode='plugin'; st.view='desktop';
  st.tutorialKind='basic'; st.noTrafficPrompt=false; st.keepExport=true; st.filter='all';
  document.getElementById('split-input').value='';

  document.querySelectorAll('#demo-view button').forEach(x=>x.classList.toggle('active',x.dataset.view==='desktop'));
  view.setStorage({ browser:DEMO_QUOTA.browser, host:DEMO_QUOTA.luker });

  view.renderLog();
  view.toast('已重置');
}
