name: Deploy to GitHub Pages

# 2026-11-22 用户裁定：每一次推送都重部署 Pages 并留下 deployment 记录（文档站/插件页
# 随每次 push 即刻上线，死链修复不用等发版）；只有 release（v* tag）时才清历史并置
# 两条 active deployment、分发 offline HTML（release.yml 负责）、打 tag。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write   # 每次推送留 deployment 记录；release(tag) 时清历史置 active

concurrency:
  group: "pages"
  cancel-in-progress: false   # 每次推送的部署都必须完整跑完留下记录，不许取消

jobs:
  # 构建 + 清历史：独立 job，不绑定 github-pages environment，删除旧 deployment 不影响发布 job。
  build:
    runs-on: ubuntu-latest
    steps:
      # 发布门禁（2026-11-22 红队修复）：不再绕过 checks——checks.yml 每次 push（含 tag）都会跑，
      # 必须等同一 commit 全绿才允许进入发布链。tag 与 checks 并发触发，故有界轮询等待结论。
      - name: Gate on checks workflow (must be green)
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while :; do
            conclusion=$(gh run list --workflow=checks.yml --commit "$GATE_SHA" --limit 1 \
              --json conclusion --jq 'if length == 0 then "no-run" else (.[0].conclusion // "running") end')
            case "$conclusion" in
              success)
                echo "checks.yml 在 ${GATE_SHA} 结论 success，放行发布"; exit 0 ;;
              failure|cancelled|timed_out|no-run)
                echo "checks.yml 在 ${GATE_SHA} 结论 ${conclusion}，拒绝发布"; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "等待 checks.yml 结论超时（15 分钟，当前 ${conclusion}），拒绝发布"; exit 1
            fi
            echo "checks.yml 尚未出结论（${conclusion}），30 秒后重查"
            sleep 30
          done

      # 清历史置 active 只在 release（v* tag）执行（2026-11-22 用户裁定）；
      # 日常 push 部署只追加 deployment 记录，不清历史。
      - name: Clear old deployments
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for env_name in github-pages github-pages-docs; do
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=${env_name}&per_page=100" --jq '.[].id' || true)
            for id in $ids; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/deployments/${id}" --silent
            done
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Docs privacy guard
        run: npm run check:docs-privacy

      - name: Docs sync verify
        run: npm run docs:verify

      - name: Build Web Application
        run: npm run build -- --base=./

      # 文档站：纯 markdown + Jekyll（GitHub Pages 官方构建器），零手写前端。
      # 产物合并到 dist/docs，与插件 Web 版同站共存：/ 是插件，/docs/ 是文档。
      - name: Build docs (Jekyll)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site_docs

      - name: Merge docs into site
        run: |
          mkdir -p dist/docs
          cp -r _site_docs/. dist/docs/
          # 死链修复（2026-11-22）：jekyll-relative-links 按站点根 baseurl（/ST-pack-transfer）
          # 生成绝对链接，但文档部署在 /docs/ 子路径下——全部绝对 href 补 /docs/ 前缀。
          # 2026-11-21 v0.7.0 起线上站内导航全 404 即此根因。
          find dist/docs -name '*.html' -type f -exec sed -i \
            -e 's|href="/ST-pack-transfer/|href="/ST-pack-transfer/docs/|g' \
            -e 's|href="/ST-pack-transfer"|href="/ST-pack-transfer/docs/"|g' \
            -e "s|href='/ST-pack-transfer/|href='/ST-pack-transfer/docs/|g" \
            -e "s|href='/ST-pack-transfer'|href='/ST-pack-transfer/docs/'|g" \
            {} +
          # 死链校验（2026-11-22 红队修复）：产物内站内链接目标缺失即失败，把线上 404 拦在发布前。
          node tooling/check-docs-links.mjs dist/docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 本体 + 文档站各 1 条 active deployment——只在 release（v* tag）执行（2026-11-22 用户裁定）。
      # 日常 push 部署到此为止：deploy-pages 的 deployment 记录已留下，不动历史。
      - name: Publish two active deployments
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          app_url="${PAGE_URL%/}"
          docs_url="${app_url}/docs/"

          # 本体：给 deploy-pages 刚建的那条 github-pages deployment 补描述与 URL
          app_dep=$(gh api "repos/${repo}/deployments?environment=github-pages&per_page=1" --jq '.[0].id')
          gh api -X POST "repos/${repo}/deployments/${app_dep}/statuses" \
            -f state=success -f description="app: ${app_url}" -f environment_url="${app_url}" > /dev/null

          # 文档站：独立 environment，单独一条 active。
          # 2026-11-22 红队修复：不再用 required_contexts:[] 整体绕过——先显式校验 checks.yml
          # 在本 commit 已 success，再把校验结果写成受控 status context（docs-deployment-gate），
          # 并以它作为 required_contexts；GitHub 侧同样强制该 context success 才创建 deployment。
          # （不能省略该参数：省略时 GitHub 校验全部 contexts，含本 workflow 自身的 in_progress check，必 409。）
          conclusion=$(gh run list --workflow=checks.yml --commit "${COMMIT_SHA}" --limit 1 \
            --json conclusion --jq 'if length == 0 then "no-run" else (.[0].conclusion // "running") end')
          if [ "$conclusion" != "success" ]; then
            echo "checks.yml 在 ${COMMIT_SHA} 结论 ${conclusion}，拒绝创建 docs deployment"; exit 1
          fi
          gh api -X POST "repos/${repo}/statuses/${COMMIT_SHA}" \
            -f state=success -f context=docs-deployment-gate \
            -f description="checks.yml green (verified before docs deployment)" > /dev/null
          docs_dep=$(printf '{"ref":"%s","task":"deploy","environment":"github-pages-docs","description":"docs: %s","required_contexts":["docs-deployment-gate"]}' \
            "${COMMIT_SHA}" "${docs_url}" | gh api -X POST "repos/${repo}/deployments" --input - --jq '.id')
          gh api -X POST "repos/${repo}/deployments/${docs_dep}/statuses" \
            -f state=success -f description="docs deployed" -f environment_url="${docs_url}" > /dev/null

          echo "app deployment ${app_dep} -> ${app_url}"
          echo "docs deployment ${docs_dep} -> ${docs_url}"
