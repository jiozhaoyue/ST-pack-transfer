name: Deploy to GitHub Pages

# 仅在正式版本 tag（v*）或手动触发时部署，杜绝日常开发 push 污染线上 Pages。
# 2026-11-17 用户裁定：发布只打 tag，不创建 GitHub Release，因此改为 tag push 触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build -- --base=./

      # 文档站：纯 markdown + Jekyll（GitHub Pages 官方构建器），零手写前端。
      # 产物合并到 dist/docs，与插件 Web 版同站共存：/ 是插件，/docs/ 是文档。
      - name: Build docs (Jekyll)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site_docs

      - name: Merge docs into site
        run: |
          mkdir -p dist/docs
          cp -r _site_docs/. dist/docs/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
