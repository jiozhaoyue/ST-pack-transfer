name: host-direct checks

# 目的：拦住「只能在打包器里成立」的写法。
# 酒馆插件是 git clone 直装、不经打包器；2026-11-11 的 JSON 静态导入曾让整张模块图
# 在宿主里失败（Failed to fetch dynamically imported module），而本地 build 完全正常。
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Host direct-load guard
        run: npm run check:no-bundler-only

      # docs 只允许登记的 markdown 文档（2026-11-16 用户规则：文档站只留组织好的 md，
      # 旧计划/交接散文档不得再堆进来）。零本地脚本依赖，避免 scripts/ 不入库的坑。
      - name: Docs layout guard
        run: |
          set -e
          allowed="_config.yml index.md install.md formats.md convert.md host-pull.md restore.md extensions.md transfer.md storage.md engines.md privacy.md tutorial.md faq.md DEVELOPER-GUIDE.md testing.md"
          for f in docs/*; do
            if [ -d "$f" ]; then echo "docs/ 下不允许目录：$f"; exit 1; fi
            base=$(basename "$f")
            case " $allowed " in
              *" $base "*) ;;
              *) echo "docs/ 下出现未登记文件：$f"; exit 1 ;;
            esac
          done
          echo "docs 布局检查通过"

      - name: Build (sanity)
        run: npm run build -- --base=./
