name: Bug 报告
description: 报告可复现的功能、兼容性、界面或数据错误
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **隐私警告**：不要粘贴真实聊天、角色卡、世界书、凭据、Cookie、Token、本机路径、IP、端口或实例目录。
        截图只能来自教程演示模式或你自己的合成测试数据。日志请先脱敏。

  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
      description: 一句话说明哪里坏了，不要只写“不能用”。
      placeholder: 例如：手机 390×844 下，扩展「包内」复选框可以同时选中两个包。
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: 运行形态
      options:
        - SillyTavern 扩展
        - Luker 扩展
        - TauriTavern 扩展
        - PureTavern 扩展
        - 独立 Web（HTTP）
        - 单文件 HTML（file://）
    validations:
      required: true

  - type: input
    id: host-version
    attributes:
      label: 宿主版本
      description: 扩展形态必填；Web / 单文件 HTML 填“不适用”。
      placeholder: 例如：SillyTavern 1.19.0 / Luker 2.9.0 / TauriTavern 公开构建 / 不适用
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器 / WebView 与版本
      description: 写清内核与版本，不要只写“浏览器”。
      placeholder: 例如：Chrome 151 / Edge 151 / Firefox 140 / Safari 18 / Tauri WebView2
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如：Windows 11 / macOS 15 / Android 15 / iOS 18
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按 1、2、3 写，确保别人能照做。
      placeholder: |
        1. 打开教程演示模式
        2. 进入扩展管理 → 包内
        3. 点击两个数据包复选框
        4. 看到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错就贴报错文本；不要贴完整日志文件。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的证据
      description: 可附演示模式截图、脱敏日志片段、控制台错误。不要上传真实数据包。
      placeholder: 只贴最小必要信息。
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有粘贴真实聊天、角色卡、世界书、凭据、Token、Cookie、本机路径、IP、端口或实例目录。
          required: true
        - label: 截图来自教程演示模式或我自己的合成测试数据。
          required: true
        - label: 我已经搜索过现有 Issue，确认不是重复报告。
          required: true
