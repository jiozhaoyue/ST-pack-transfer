name: 功能建议
description: 提出新功能、兼容性改进或体验优化
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先说明**使用场景**：哪个宿主、哪个版本、Web 还是单文件 HTML、什么浏览器/WebView。
        不要只写“希望支持 X”，要写清现有流程卡在哪一步。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述真实使用场景与当前阻碍。
      placeholder: 例如：在 Luker 2.9 的 PostgreSQL 源包上，我需要在手机浏览器里确认引擎载体是否完整。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望界面/流程怎么变化。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: runtime
    attributes:
      label: 主要影响形态
      options:
        - SillyTavern 扩展
        - Luker 扩展
        - TauriTavern 扩展
        - PureTavern 扩展
        - 独立 Web（HTTP）
        - 单文件 HTML（file://）
        - 全部形态
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 宿主 / 浏览器环境
      description: 写清宿主版本与浏览器/WebView 版本。
      placeholder: 例如：Luker 2.9.0 + Chrome 151 / Web 模式 + Firefox 140 / 单文件 HTML + Safari 18
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 影响面
      description: 是否会改变文件布局、转换结果、隐私行为或现有用户设置？
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认这不是已有功能，也不是现有 Issue 的重复建议。
          required: true
        - label: 我没有粘贴真实用户数据、凭据或本机隐私信息。
          required: true
