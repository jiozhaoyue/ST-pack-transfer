<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据包转运 · UI Demo</title>
<style>
  /* ── 模拟酒馆主题令牌（取值来自真机：Luker Dev · public/style.css:71-82 默认主题）
        面板底色 / 文字 / 边框 / 强调**全部继承宿主令牌**，插件不自建独立配色。
        注意真机默认 `--SmartThemeBorderColor: rgba(0,0,0,.5)` —— 深色底上等于看不见，
        所以「可见轮廓」必须由 BodyColor 派生（--outline），不能用宿主边框色。 ── */
  :root{
    --SmartThemeBodyColor: rgb(220,220,210);
    --SmartThemeEmColor: rgb(145,145,145);
    --SmartThemeUnderlineColor: rgb(188,231,207);
    --SmartThemeQuoteColor: rgb(225,138,36);
    --SmartThemeBlurTintColor: rgba(23,23,23,1);
    --SmartThemeChatTintColor: rgba(23,23,23,1);
    --SmartThemeShadowColor: rgba(0,0,0,.5);
    --SmartThemeBorderColor: rgba(0,0,0,.5);

    /* 派生层（与项目 style.css:35-57 同一套映射） */
    --bg:#0b0b0d;
    --panel: var(--SmartThemeBlurTintColor,#14161c);
    --panel-2: color-mix(in srgb, var(--SmartThemeChatTintColor,#1b1e27) 92%, var(--SmartThemeBodyColor,#f2f4f8) 8%);
    --panel-3: color-mix(in srgb, var(--SmartThemeChatTintColor,#1b1e27) 84%, var(--SmartThemeBodyColor,#f2f4f8) 16%);
    --border: color-mix(in srgb, var(--SmartThemeBodyColor,#f2f4f8) 14%, transparent);
    --border-strong: color-mix(in srgb, var(--SmartThemeBodyColor,#f2f4f8) 26%, transparent);
    --outline: color-mix(in srgb, var(--SmartThemeBodyColor,#f2f4f8) 36%, transparent);
    --text: var(--SmartThemeBodyColor,#f2f4f8);
    --muted: color-mix(in srgb, var(--text) 62%, transparent);
    --muted-2: color-mix(in srgb, var(--text) 42%, transparent);
    --accent: var(--SmartThemeQuoteColor,#9a9a92);
    --accent-soft: color-mix(in srgb, var(--accent) 20%, transparent);
    --keep: var(--SmartThemeUnderlineColor,#4fbf86);
    --keep-bg: color-mix(in srgb, var(--keep) 14%, transparent);
    --optional: var(--accent);
    --optional-bg: color-mix(in srgb, var(--optional) 14%, transparent);
    --drop: var(--SmartThemeEmColor,#dcdcd2);
    --drop-bg: color-mix(in srgb, var(--drop) 16%, transparent);
    --unknown: var(--muted-2);
    --unknown-bg: color-mix(in srgb, var(--unknown) 14%, transparent);
    --shadow: 0 24px 70px var(--SmartThemeShadowColor,rgba(0,0,0,.55));

    /* 平台品牌色：**只用于标识**（包卡环、宿主角标、来源标签）。
       不参与面板/按钮/勾选/进度条染色 —— 那些一律随酒馆主题。 */
    --brand-st:#a11b1b;      --brand-st-ink:#fff6f5;  --brand-st-ring:#c4413a;
    --brand-luker:#121216;   --brand-luker-ink:#e6e7ec;
    --brand-luker-ring: color-mix(in srgb, var(--text) 54%, transparent);
    --brand-tt:#f2c75c;      --brand-tt-ink:#2b2100;  --brand-tt-ring:#f2c75c;
    --brand-pt:#7d5cb0;      --brand-pt-ink:#f7f3ff;  --brand-pt-ring:#a486d8;
    --radius:12px;
  }
  [data-theme="light"]{
    --SmartThemeBodyColor: rgb(38,38,44);
    --SmartThemeEmColor: rgb(110,110,118);
    --SmartThemeUnderlineColor: rgb(28,120,84);
    --SmartThemeQuoteColor: rgb(176,96,16);
    --SmartThemeBlurTintColor: rgba(240,240,244,1);
    --SmartThemeChatTintColor: rgba(250,250,252,1);
    --SmartThemeShadowColor: rgba(30,30,60,.18);
    --SmartThemeBorderColor: rgba(255,255,255,.6);
    --bg:#e9eaef;
    --brand-luker:#20202a;  --brand-luker-ring: color-mix(in srgb, var(--text) 48%, transparent);
    --brand-tt:#c2901c;     --brand-tt-ring:#c2901c;
    --brand-pt:#6a4b9c;     --brand-pt-ring:#6a4b9c;
    --brand-st:#8f1717;     --brand-st-ring:#8f1717;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;font-size:14px}
  body{min-height:100vh;display:flex;justify-content:center;padding:18px}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  .demo-shell{width:100%;max-width:1220px;min-width:0}

  /* ── 演示控制（面板之外，不属于插件 UI） ── */
  .demo-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px;
    color:var(--muted);font-size:12px}
  .demo-toolbar .tag{font-weight:600;color:var(--text);margin-right:4px}
  .demo-seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--panel)}
  .demo-seg button{border:0;background:transparent;padding:5px 9px;font-size:12px;color:var(--muted)}
  .demo-seg button.active{background:var(--accent-soft);color:var(--text)}
  .demo-btn{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted)}
  .demo-btn:hover{color:var(--text);border-color:var(--border-strong)}
  .demo-note{margin-left:auto;color:var(--muted-2)}

  /* ── 插件面板 ── */
  /* 面板轮廓：宿主 --SmartThemeBorderColor 默认是 rgba(0,0,0,.5)，深色底上根本看不见，
     所以轮廓统一由 BodyColor 派生的 --outline 画：1px 实线 + 一圈柔光，任何主题下都可见。 */
  .app-container{
    width:100%;height:min(860px,calc(100vh - 110px));display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--outline);border-radius:14px;
    overflow:hidden;
    box-shadow:0 0 0 1px color-mix(in srgb, var(--outline) 55%, transparent),
               0 0 0 7px color-mix(in srgb, var(--outline) 10%, transparent),
               var(--shadow)}

  .app-header{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:11px 14px;
    border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--panel-2),var(--panel))}
  .app-title{display:flex;align-items:baseline;gap:8px;min-width:0}
  .app-title h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap}
  .app-title .sub{font-size:11px;color:var(--muted-2);white-space:nowrap}
  .header-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;
    border:1px solid var(--border);background:var(--panel-3);font-size:11px;color:var(--muted);white-space:nowrap}
  .badge .host-icon{width:14px;height:14px;object-fit:contain}
  .badge .gh-icon{flex:0 0 auto}
  .badge .gh-icon[hidden], .badge .host-icon[hidden]{display:none}
  .badge.accent{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
  .icon-btn{position:relative;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--border);background:var(--panel-3);border-radius:8px;color:var(--muted);padding:0}
  .icon-btn:hover{color:var(--text);border-color:var(--border-strong)}

  .app-main{flex:1 1 auto;min-height:0;display:grid;
    grid-template-columns:minmax(0,var(--split-left,62%)) 8px minmax(0,1fr);
    column-gap:0;row-gap:8px;padding:10px 10px 8px;overflow:hidden}
  .col-chart{min-height:0;min-width:0;display:flex;flex-direction:column;gap:10px}
  .col-side{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;gap:0;
    overflow:visible;padding:0 2px 0 0}
  /* 右栏：数据包高度可拖，执行卡吃掉剩余高度 —— 两栏都贴到底，不留空白 */
  .col-side > .panel{flex:0 0 auto}
  .col-side > .zone-card{flex:0 0 var(--zone-h,56%);min-height:140px}
  .col-side > .action-card{flex:1 1 auto;min-height:96px}

  /* 拖拽分隔条：拖中间改列宽，拖右栏内改上下高度 */
  .splitter-v{width:8px;cursor:col-resize;align-self:stretch;display:flex;align-items:center;
    justify-content:center;touch-action:none}
  .splitter-v::before{content:'';width:2px;height:100%;border-radius:2px;
    background:color-mix(in srgb, var(--outline) 26%, transparent);
    transition:background .15s ease}
  .splitter-v:hover::before,.splitter-v.is-dragging::before{background:var(--outline)}
  .splitter-h{flex:0 0 auto;height:8px;cursor:row-resize;display:flex;align-items:center;
    justify-content:center;touch-action:none}
  .splitter-h::before{content:'';height:2px;width:100%;border-radius:2px;
    background:color-mix(in srgb, var(--outline) 26%, transparent);
    transition:background .15s ease}
  .splitter-h:hover::before,.splitter-h.is-dragging::before{background:var(--outline)}
  /* 两条分隔条的交叉点：十字光标，一次拖动同时改宽与高 */
  /* 十字手柄正压在两线交点上：横向落在 8px 分隔条中心，纵向落在横向分隔条中心 */
  .splitter-corner{position:absolute;left:-8px;top:calc(var(--zone-h,56%) - 1px);width:8px;height:10px;
    cursor:move;z-index:6;touch-action:none}
  .splitter-corner::before{content:'';position:absolute;inset:2px;border-radius:2px;
    background:color-mix(in srgb, var(--outline) 40%, transparent)}
  .splitter-corner:hover::before,.splitter-corner.is-dragging::before{background:var(--accent)}

  .panel{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);
    display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
  .chart-card{flex:1 1 auto}
  .panel-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 12px;
    border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--panel-3),transparent)}
  .panel-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;min-width:0}
  .panel-title .ico{width:16px;height:16px;color:var(--accent);flex:0 0 auto}
  .panel-title .source-chip{font-weight:400;font-size:11px;color:var(--muted);
    border:1px solid var(--border);border-radius:999px;padding:2px 8px;max-width:260px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .panel-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .help-btn{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);
    background:var(--panel-3);color:var(--muted);font-size:12px;line-height:1;padding:0}
  .help-btn:hover{color:var(--text);border-color:var(--accent);color:var(--accent)}

  /* 图表控制 */
  .chart-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;
    border-bottom:1px solid var(--border)}
  .field{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
  .field select,.field input{background:var(--panel-3);border:1px solid var(--border);border-radius:7px;
    padding:4px 7px;font-size:12px;color:var(--text);max-width:190px}
  .field input[type="number"]{width:78px}
  .segmented{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;background:var(--panel-3)}
  .segmented button{border:0;background:transparent;padding:4px 9px;font-size:11px;color:var(--muted)}
  .segmented button.active{background:var(--accent-soft);color:var(--text)}
  .split-sim{font-size:10px;color:var(--muted-2);white-space:nowrap}
  .filename-row{display:flex;flex-direction:column;align-items:stretch;gap:5px;padding:8px 12px 10px;
    border-bottom:1px solid var(--border)}
  .filename-row textarea{width:100%;box-sizing:border-box;min-height:32px;resize:vertical;
    background:var(--panel-3);border:1px solid var(--border);border-radius:7px;padding:6px 8px;
    font-family:Consolas,"Cascadia Mono",monospace;font-size:11px;line-height:1.5;color:var(--text)}
  .filename-row textarea:focus{outline:none;border-color:var(--accent)}
  .filename-preview{font-family:Consolas,"Cascadia Mono",monospace;font-size:10px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

  /* 配额表头 */
  .quota-head{display:flex;flex-direction:column;gap:7px;padding:9px 12px;border-bottom:1px solid var(--border)}
  .quota-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
  .quota-row .q-label{display:inline-flex;align-items:center;gap:5px;min-width:92px;color:var(--text)}
  .quota-bar{display:block;flex:1 1 auto;height:7px;background:var(--panel-3);border:1px solid var(--border);
    border-radius:999px;overflow:hidden;min-width:80px}
  .quota-fill{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--keep));border-radius:999px}
  .quota-fill.warn{background:linear-gradient(90deg,var(--optional),var(--drop))}
  .quota-val{font-variant-numeric:tabular-nums;white-space:nowrap}
  .quota-row.is-disabled{opacity:.55}
  .quota-row.is-disabled .quota-bar{background:repeating-linear-gradient(45deg,var(--panel-3),var(--panel-3) 4px,transparent 4px,transparent 8px)}

  .legend{display:flex;align-items:center;gap:12px;padding:6px 12px;border-bottom:1px solid var(--border);
    font-size:10px;color:var(--muted);flex-wrap:wrap}
  .legend .item{display:inline-flex;align-items:center;gap:4px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dot.keep{background:var(--keep)} .dot.optional{background:var(--optional)}
  .dot.drop{background:var(--drop)} .dot.unknown{background:var(--unknown)}

  .tree-tools{display:flex;align-items:center;gap:5px;padding:5px 12px;border-bottom:1px solid var(--border)}
  .tree-tools button{border:1px solid var(--border);background:var(--panel-3);border-radius:6px;
    padding:2px 7px;font-size:10px;color:var(--muted)}
  .tree-tools button:hover{color:var(--text);border-color:var(--accent)}
  .tree-tools .spacer{flex:1}
  .tree-tools .hint{font-size:10px;color:var(--muted-2)}
  .chart-tree{flex:1 1 auto;min-height:120px;overflow:auto;padding:4px 6px 10px}
  .tree-row{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:6px;min-height:28px}
  .tree-row:hover{background:rgba(255,255,255,.035)}
  [data-theme="light"] .tree-row:hover{background:rgba(20,20,40,.035)}
  .tree-toggle{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;
    border:0;background:transparent;color:var(--muted);padding:0;flex:0 0 auto}
  .tree-toggle .chev{transition:transform .12s ease}
  .tree-row.expanded .tree-toggle .chev{transform:rotate(90deg)}
  .tree-toggle.empty{visibility:hidden}
  .tree-check{width:14px;height:14px;accent-color:var(--accent);flex:0 0 auto;margin:0}
  .tree-ico{width:15px;height:15px;color:var(--muted);flex:0 0 auto}
  .tree-label{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:12.5px;color:var(--text)}
  .tree-label .sub{color:var(--muted-2);font-size:10px;margin-left:5px}
  .tree-size{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .tree-pill{font-size:9.5px;padding:1px 6px;border-radius:999px;border:1px solid;white-space:nowrap}
  .tree-pill.keep{color:var(--keep);border-color:var(--keep);background:var(--keep-bg)}
  .tree-pill.optional{color:var(--optional);border-color:var(--optional);background:var(--optional-bg)}
  .tree-pill.drop{color:var(--drop);border-color:var(--drop);background:var(--drop-bg)}
  .tree-pill.unknown{color:var(--unknown);border-color:var(--unknown);background:var(--unknown-bg)}
  .tree-mini{font-size:10px;padding:1px 6px;border-radius:5px;border:1px solid var(--border);
    background:var(--panel-3);color:var(--muted);white-space:nowrap}
  .tree-mini:hover{color:var(--text);border-color:var(--accent)}
  .tree-children{padding-left:17px;border-left:1px dashed var(--border);margin-left:8px}
  .chart-unavailable{margin:8px 10px;padding:10px 12px;border:1px dashed var(--border);border-radius:9px;
    background:var(--panel-3);font-size:11.5px;color:var(--muted);line-height:1.6}
  .chart-unavailable b{color:var(--text);font-weight:600}
  .chart-foot{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid var(--border);
    font-size:10.5px;color:var(--muted)}
  .chart-foot .spacer{flex:1}
  .chart-foot .target-badge{color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 7px}

  /* ── 图表栈：一卷 = 一张标准图表卡；桌面网格、移动单列可折叠 ── */
  .chart-stack{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;
    padding:8px 10px 10px}
  .chart-group{display:flex;flex-direction:column;gap:7px;min-width:0;flex:0 0 auto}
  .chart-group-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:0 2px;
    font-size:11px;color:var(--muted)}
  .chart-group-head .g-name{color:var(--text);font-weight:600}
  .vol-grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    align-content:start;align-items:start}
  .vol-grid[data-vols="1"]{grid-template-columns:minmax(0,1fr)}
  /* 只有一组图表时让卡片撑满面板剩余高度（flex-basis 必须为 0，否则按内容高度撑破面板）。
     卡片内树自己滚动，底部勾选摘要才不会被裁掉。 */
  .chart-stack > .chart-group:only-child{flex:1 1 0;min-height:0}
  .chart-stack > .chart-group:only-child .vol-grid{height:100%;align-content:stretch;
    grid-template-rows:minmax(0,1fr)}
  .chart-stack > .chart-group:only-child .vol-card{height:100%}
  .chart-stack > .chart-group:only-child .vol-card .chart-tree{max-height:none}

  .vol-card{display:flex;flex-direction:column;min-width:0;
    border:1px solid var(--border);border-radius:10px;background:var(--panel-2);overflow:hidden}
  .vol-head{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 9px;
    border-bottom:1px solid var(--border);
    background:color-mix(in srgb, var(--panel-3) 72%, transparent);
    font-size:11.5px;color:var(--text)}
  .vol-head .vol-idx{font-weight:600}
  .vol-head .vol-cap{color:var(--muted);font-variant-numeric:tabular-nums}
  .vol-head .vol-spacer{flex:1}
  .vol-head .vol-total{font-size:10px;color:var(--muted-2);white-space:nowrap}
  .vol-collapse{width:20px;height:20px;display:none;align-items:center;justify-content:center;
    border:1px solid var(--border);background:var(--panel-3);border-radius:5px;color:var(--muted);padding:0}
  .vol-card.is-collapsed .vol-body{display:none}
  .vol-card.is-collapsed .vol-head{border-bottom-color:transparent}
  .vol-body{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
  .vol-card .chart-tree{flex:1 1 auto;min-height:0;max-height:250px}
  .field .unit{font-size:10px;color:var(--muted-2);margin-left:-2px}

  /* ── 目标平台下拉：icon + 英文全称 +（宿主）标记；品牌色只在图标环上 ── */
  .picker{position:relative;display:inline-block}
  .picker-btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel-3);
    border:1px solid var(--border);border-radius:7px;padding:4px 7px;font-size:12px;color:var(--text);
    min-width:148px;justify-content:flex-start}
  .picker-btn:hover{border-color:var(--border-strong)}
  .picker-btn[aria-expanded="true"]{border-color:var(--accent)}
  .picker-btn .caret{width:10px;height:10px;color:var(--muted);margin-left:auto}
  .picker-ico{width:16px;height:16px;flex:0 0 auto;object-fit:contain;border-radius:4px;
    outline:1.5px solid transparent;outline-offset:1px}
  .picker-ico[data-host="st"]{outline-color:var(--brand-st-ring)}
  .picker-ico[data-host="luker"]{outline-color:var(--brand-luker-ring);background:#eceef2;padding:1px}
  .picker-ico[data-host="tt"]{outline-color:var(--brand-tt-ring)}
  .picker-ico[data-host="pt"]{outline-color:var(--brand-pt-ring)}
  .picker-pop{position:absolute;z-index:70;top:calc(100% + 5px);left:0;min-width:100%;
    max-width:calc(100vw - 24px);display:flex;flex-direction:column;gap:2px;padding:4px;
    background:var(--panel);border:1px solid var(--outline);border-radius:9px;box-shadow:var(--shadow)}
  .picker-pop[hidden]{display:none}
  .picker-item{display:flex;align-items:center;gap:7px;width:100%;padding:5px 7px;border:0;
    border-radius:6px;background:transparent;color:var(--text);font-size:12px;text-align:left;white-space:nowrap}
  .picker-item:hover{background:var(--panel-3)}
  .picker-item[aria-selected="true"]{background:var(--accent-soft)}
  .picker-item .host-tag{font-size:9.5px;color:var(--muted);border:1px solid var(--border);
    border-radius:999px;padding:0 5px}

  /* 图表组头：包序号是图表唯一身份；右侧 × 关掉该包图表 */
  .chart-group-head .g-name{font-weight:600}
  .group-close{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--border);background:var(--panel-3);border-radius:5px;color:var(--muted);
    padding:0;font-size:12px;line-height:1}
  .group-close:hover{color:var(--text);border-color:var(--outline)}
  .vol-head .chev{transform:rotate(90deg);transition:transform .12s ease}
  .vol-card.is-collapsed .vol-head .chev{transform:rotate(0deg)}

  /* 包序号：只留数字，压在图标左上角，不占包名宽度 */
  .pkg-seq{position:absolute;left:-5px;top:-5px;z-index:2;font-size:8px;line-height:1.5;
    padding:0 3px;border-radius:4px;background:var(--panel);font-weight:600;white-space:nowrap}

  /* [hidden] 必须显式压过同特异度的 display（见 CLAUDE.md 坑 10） */
  .batch-bar[hidden]{display:none}
  .batch-bar .scope{color:var(--text);font-weight:600}

  /* 分区 */
  .zone-tabs{display:flex;gap:4px;padding:7px 9px;border-bottom:1px solid var(--border)}
  .zone-tab{border:1px solid transparent;background:transparent;color:var(--muted);
    padding:5px 12px;border-radius:7px;font-size:12px}
  .zone-tab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
  .zone-tab .count{font-size:10px;color:var(--muted-2);margin-left:5px}
  .zone-body{padding:9px;display:flex;flex-direction:column;gap:9px;min-height:0;overflow:hidden}
  /* 选择数据包 / 格式 / 排序固定不动，只有下面的包卡列表滚动 */
  .zone-body > .card-list{flex:1 1 auto;min-height:0;overflow:auto;padding-right:3px}
  .dropzone{border:1px dashed var(--border-strong);border-radius:9px;padding:12px;text-align:center;
    color:var(--muted);font-size:12px;background:var(--panel-3);cursor:pointer}
  .dropzone:hover{border-color:var(--accent);color:var(--text)}
  .dropzone .big{display:block;font-size:13px;color:var(--text);margin-bottom:2px}
  .zone-toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
  .zone-toolbar select{background:var(--panel-3);border:1px solid var(--border);border-radius:7px;
    padding:3px 7px;font-size:11px;color:var(--text)}
  .zone-toolbar .spacer{flex:1}
  .card-list{display:flex;flex-direction:column;gap:7px}
  .pkg-card{display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid var(--border);
    border-radius:9px;background:var(--panel-3);min-width:0;position:relative}
  .pkg-card:hover{border-color:var(--border-strong)}
  .pkg-card.is-active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .pkg-card.unrecognized{border-style:dashed}
  .pkg-card.is-export{background:linear-gradient(180deg,var(--panel-3),var(--panel-2))}
  .pkg-card .pkg-check{width:14px;height:14px;accent-color:var(--accent);flex:0 0 auto;margin:0}
  .pkg-icon{width:30px;height:30px;flex:0 0 auto;border-radius:8px;padding:3px;background:var(--panel);
    border:1px solid var(--border);object-fit:contain}
  .pkg-icon-wrap{position:relative;flex:0 0 auto;width:30px;height:30px}
  .pkg-icon-wrap .pkg-icon{width:30px;height:30px}
  .pkg-host-tag{position:absolute;right:-4px;bottom:-4px;font-size:7.5px;line-height:1.2;
    padding:1px 3px;border-radius:4px;background:var(--panel);border:1px solid currentColor;
    white-space:nowrap;letter-spacing:.2px}
  /* 平台品牌色：**只出现在标识上**（图标环 + 宿主角标 + 来源标签），不染面板底色/按钮。 */
  .pkg-icon[data-host="st"]{border-color:var(--brand-st-ring)}
  .pkg-icon[data-host="luker"]{border-color:var(--brand-luker-ring)}
  .pkg-icon[data-host="tt"]{border-color:var(--brand-tt-ring)}
  .pkg-icon[data-host="pt"]{border-color:var(--brand-pt-ring)}
  .pkg-icon[data-host="unknown"]{border-color:var(--unknown);opacity:.85}
  /* Luker 的图标是纯黑剪影，深色底上必须垫浅底 */
  .pkg-icon[data-host="luker"], .host-icon[data-host="luker"]{
    background:#eceef2; border-radius:8px; padding:2px}
  .host-icon[data-host="luker"]{padding:1px;border-radius:5px}
  .host-icon[data-host="luker"], .host-icon[data-host="st"],
  .host-icon[data-host="tt"], .host-icon[data-host="pt"]{object-fit:contain}
  .pkg-info{min-width:0;flex:1 1 auto}
  .pkg-name{display:flex;align-items:center;gap:6px;min-width:0;font-size:12.5px;color:var(--text);
    cursor:default}
  .pkg-name .pkg-name-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 换行只在这行尾段够满时才允许，避免第二行只剩「.zip」这种残句（由 fitPackageNames 判定） */
  .pkg-name .pkg-name-txt.two-line{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;word-break:break-all;line-height:1.35}
  .pkg-card[data-mobile="1"] .pkg-name{cursor:pointer}
  .pkg-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:10px;color:var(--muted);
    margin-top:2px}
  .pkg-badge{font-size:9.5px;padding:1px 6px;border-radius:999px;border:1px solid var(--border);
    color:var(--muted);white-space:nowrap}
  .pkg-badge.warn{color:var(--optional);border-color:var(--optional);background:var(--optional-bg)}
  .pkg-badge.unknown{color:var(--unknown);border-color:var(--unknown);background:var(--unknown-bg)}
  .pkg-badge.lock{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .pkg-actions{display:flex;align-items:center;gap:4px;flex:0 0 auto}
  .pkg-actions button{width:24px;height:24px;border:1px solid var(--border);border-radius:6px;
    background:var(--panel);color:var(--muted);padding:0;display:inline-flex;align-items:center;justify-content:center}
  .pkg-actions button:hover{color:var(--text);border-color:var(--accent)}
  .batch-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 9px;border:1px solid var(--accent);
    border-radius:8px;background:var(--accent-soft);font-size:11px}
  .batch-bar .lbl{color:var(--text);margin-right:2px}
  .batch-bar button{border:1px solid var(--border);background:var(--panel);border-radius:6px;
    padding:3px 7px;font-size:10.5px;color:var(--text)}
  .batch-bar button:disabled{opacity:.45;cursor:not-allowed}
  .zone-empty{padding:16px;text-align:center;color:var(--muted-2);font-size:11.5px}

  /* 操作条 */
  .action-row{display:flex;gap:6px;flex-wrap:wrap;padding:9px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--border);
    background:var(--panel-3);border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--text);min-height:30px}
  .btn:hover{border-color:var(--border-strong)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.accent:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent}
  .btn .ico{width:14px;height:14px}
  .progress{padding:0 9px 9px}
  .progress-bar{height:6px;background:var(--panel-3);border:1px solid var(--border);border-radius:999px;overflow:hidden}
  .progress-fill{height:100%;width:0%;background:var(--accent);transition:width .3s ease}
  .progress-text{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}

  /* 日志 */
  .log-modal{width:min(620px,100%);max-height:82vh;display:flex;flex-direction:column;gap:9px}
  .log-modal-head{display:flex;align-items:center;gap:8px}
  .log-modal-head h3{margin:0}
  .log-modal-head .latest{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;color:var(--muted);font-size:11px;padding-right:4px}
  .log-modal .log-toolbar{flex-wrap:wrap;padding:0}
  .log-modal .log-body{display:block;max-height:56vh;overflow:auto;padding:8px 10px;
    border:1px solid var(--border);border-radius:8px;background:var(--panel-2)}
  .log-badge{font-size:9px;padding:1px 5px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
  .log-badge.warn{color:var(--optional);border-color:var(--optional)}
  .log-badge.err{color:var(--drop);border-color:var(--drop)}
  .log-dot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;
    background:var(--optional);display:block}
  .log-dot[hidden]{display:none}
  .log-toolbar{display:flex;gap:5px;align-items:center;padding:0 0 6px;flex-wrap:wrap}
  .log-toolbar button{border:1px solid var(--border);background:var(--panel-3);border-radius:5px;
    padding:2px 6px;font-size:9.5px;color:var(--muted)}
  .log-toolbar button.active{color:var(--text);border-color:var(--accent);background:var(--accent-soft)}
  .log-line{font-family:Consolas,"Cascadia Mono",monospace;font-size:10.5px;line-height:1.55;
    white-space:pre-wrap;word-break:break-all;color:var(--muted)}
  .log-line .t{color:var(--muted-2)}
  .log-line .lv{font-weight:600}
  .log-line.info .lv{color:var(--keep)} .log-line.warn .lv{color:var(--optional)}
  .log-line.error .lv{color:var(--drop)}

  /* 帮助浮层 / 弹窗 / toast */
  .help-popover{position:fixed;z-index:140;width:min(280px,calc(100vw - 24px));background:var(--panel);
    border:1px solid var(--border-strong);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow)}
  .help-popover h4{margin:0 0 6px;font-size:12px}
  .help-popover ul{margin:0;padding-left:16px;font-size:11px;color:var(--muted);line-height:1.7}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;
    align-items:center;justify-content:center;padding:16px}
  .modal-overlay.open{display:flex}
  .modal{width:min(430px,100%);background:var(--panel);border:1px solid var(--border-strong);
    border-radius:12px;padding:15px;box-shadow:var(--shadow)}
  .modal h3{margin:0 0 6px;font-size:14px}
  .modal p{margin:0 0 10px;font-size:11.5px;color:var(--muted);line-height:1.6}
  .modal .check{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin:8px 0}
  .modal .actions{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
  .entry-mock{display:flex;flex-direction:column;gap:6px}
  .entry-mock h4{margin:7px 0 2px;font-size:11px;color:var(--muted)}
  .mock-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--border);
    border-radius:7px;background:var(--panel-3);font-size:11px}
  .mock-row.disabled{opacity:.5;border-style:dashed}
  .mock-row .spacer{flex:1}
  .mock-btn{border:1px solid var(--border);background:var(--panel);border-radius:5px;padding:2px 7px;
    font-size:10px;color:var(--text)}
  .mock-btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .mock-drawer{margin:-4px 0 0 18px;padding:6px 8px;border:1px solid var(--accent);
    border-radius:0 0 7px 7px;background:var(--accent-soft)}
  .mock-toggle{width:20px;height:10px;border-radius:999px;background:var(--keep);display:inline-block}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);z-index:120;
    background:var(--panel);border:1px solid var(--accent);border-radius:9px;padding:8px 13px;
    font-size:11.5px;color:var(--text);box-shadow:var(--shadow);opacity:0;pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;max-width:calc(100vw - 32px)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .fullname-pop{position:fixed;z-index:110;width:min(320px,calc(100vw - 24px));background:var(--panel);
    border:1px solid var(--accent);border-radius:9px;padding:9px 11px;font-size:11.5px;
    color:var(--text);box-shadow:var(--shadow);word-break:break-all;line-height:1.6}

  /* 教程 */
  .tutorial-overlay{position:fixed;inset:0;z-index:95;display:none}
  .tutorial-overlay.open{display:block}
  .tutorial-ring{position:fixed;border:2px solid var(--accent);border-radius:9px;pointer-events:none;
    box-shadow:0 0 0 9999px rgba(0,0,0,.42);transition:all .16s ease}
  .tutorial-card{position:fixed;width:min(330px,calc(100vw - 24px));background:var(--panel);
    border:1px solid var(--accent);border-radius:11px;padding:12px;box-shadow:var(--shadow)}
  .tutorial-card .tt{font-size:13px;font-weight:600;margin-bottom:6px}
  .tutorial-card .td{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:9px}
  .tutorial-card .dots{display:flex;gap:4px;margin-bottom:9px}
  .tutorial-card .dots i{width:6px;height:6px;border-radius:50%;background:var(--border-strong)}
  .tutorial-card .dots i.on{background:var(--accent)}
  .tutorial-card .acts{display:flex;gap:5px;justify-content:flex-end}
  .tutorial-card .acts button{border:1px solid var(--border);background:var(--panel-3);border-radius:6px;
    padding:4px 9px;font-size:10.5px;color:var(--text)}
  .tutorial-card .acts button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .tutorial-card .acts button.link{border-color:transparent;background:transparent;color:var(--muted);
    text-decoration:underline;margin-right:auto;padding-left:0}
  .tutorial-card .acts button.link:hover{color:var(--text)}

  /* 移动端：演示切换 + 真实窄屏 */
  .app-container[data-view="mobile"]{width:390px;max-width:100%;height:min(820px,calc(100vh - 110px));margin:0 auto}
  .app-container[data-view="mobile"] .splitter-v,
  .app-container[data-view="mobile"] .splitter-h,
  .app-container[data-view="mobile"] .splitter-corner{display:none}
  .app-container[data-view="mobile"] .app-main{display:flex;flex-direction:column;gap:10px;overflow:auto}
  /* 竖排时子块一律不被压缩，否则 flex-shrink 会把下面的面板压成 2px 并被上方内容盖住。
     注意 `.col-side{display:contents}` 只改变布局树、不改变 DOM 树，
     选择器仍要按 DOM 写 `.col-side > *`，不能用 `.app-main > *` 一并覆盖。 */
  .app-container[data-view="mobile"] .app-main > *,
  .app-container[data-view="mobile"] .col-side > *{flex:0 0 auto}
  .app-container[data-view="mobile"] .col-chart{flex:0 0 auto}
  .app-container[data-view="mobile"] .col-side{display:contents}
  .app-container[data-view="mobile"] .chart-card{flex:0 0 auto}
  .app-container[data-view="mobile"] .chart-stack > .chart-group:only-child{flex:0 0 auto}
  .app-container[data-view="mobile"] .chart-stack > .chart-group:only-child .vol-grid,
  .app-container[data-view="mobile"] .chart-stack > .chart-group:only-child .vol-card{height:auto}
  .app-container[data-view="mobile"] .chart-stack{overflow:visible;padding:8px}
  .app-container[data-view="mobile"] .vol-grid{grid-template-columns:minmax(0,1fr)}
  .app-container[data-view="mobile"] .vol-collapse{display:inline-flex}
  .app-container[data-view="mobile"] .vol-card .chart-tree{height:auto;max-height:260px}
  .app-container[data-view="mobile"] .app-title .sub{display:none}
  .app-container[data-view="mobile"] .field select{max-width:150px}
  .app-container[data-view="mobile"] .panel-title .source-chip{max-width:150px}

  @media (max-width:860px){
    body{padding:8px}
    .demo-toolbar{font-size:11px}
    .demo-note{display:none}
    .app-container{height:auto;min-height:calc(100vh - 96px)}
    .app-main{display:flex;flex-direction:column;gap:10px;overflow:auto}
    .splitter-v,.splitter-h,.splitter-corner{display:none}
    .app-main > *,.col-side > *{flex:0 0 auto}
    .col-chart{flex:0 0 auto}
    .col-side{display:contents}
    .chart-stack > .chart-group:only-child{flex:0 0 auto}
    .chart-stack > .chart-group:only-child .vol-grid,
    .chart-stack > .chart-group:only-child .vol-card{height:auto}
    .chart-stack{overflow:visible}
    .vol-grid{grid-template-columns:minmax(0,1fr)}
    .vol-collapse{display:inline-flex}
    .vol-card .chart-tree{max-height:260px}
    .chart-card{flex:0 0 auto}
  }
</style>
</head>
<body>
<div class="demo-shell">

  <div class="demo-toolbar">
    <span class="tag">演示控制</span>
    <span>宿主</span>
    <div class="demo-seg" id="demo-host">
      <button data-host="luker" class="active">Luker</button>
      <button data-host="pt">PureTavern</button>
      <button data-host="tt">TauriTavern</button>
      <button data-host="st">SillyTavern</button>
    </div>
    <span>模式</span>
    <div class="demo-seg" id="demo-mode">
      <button data-mode="plugin" class="active">酒馆插件</button>
      <button data-mode="web">Web</button>
    </div>
    <span>视图</span>
    <div class="demo-seg" id="demo-view">
      <button data-view="desktop" class="active">桌面</button>
      <button data-view="mobile">移动</button>
    </div>
    <span>酒馆主题</span>
    <div class="demo-seg" id="demo-theme">
      <button data-theme="dark" class="active">深色</button>
      <button data-theme="light">浅色</button>
    </div>
    <button class="demo-btn" id="demo-entries">入口预览</button>
    <button class="demo-btn" id="demo-tutorial">重放教程</button>
    <button class="demo-btn" id="demo-reset">重置</button>
    <span class="demo-note">面板之外的元素只用于演示控制</span>
  </div>

  <div class="app-container" id="app" data-host="luker" data-view="desktop">
    <header class="app-header">
      <div class="app-title">
        <h1>数据包转运</h1>
        <span class="sub">ST-pack-transfer</span>
      </div>
      <div class="header-actions">
        <span class="badge accent" id="host-badge"><img class="host-icon" id="host-badge-icon" alt=""><svg class="gh-icon" id="host-badge-gh" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" hidden><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.9-1.29 2.74-1.02 2.74-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 22 12A10 10 0 0 0 12 2z"/></svg><span id="host-badge-text">Luker 插件</span></span>
        <button class="icon-btn" id="btn-guide" title="基础教程">?</button>
        <button class="icon-btn" id="btn-log" title="日志">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v14H4z"/><path d="M7 9h10M7 13h7"/></svg>
          <span class="log-dot" id="log-dot" hidden></span>
        </button>
        <button class="icon-btn" id="btn-settings" title="设置"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></button>
        <button class="icon-btn" id="btn-close" title="关闭">×</button>
      </div>
    </header>

    <main class="app-main">
      <div class="col-chart">
        <section class="panel chart-card" id="chart-card">
          <div class="panel-head">
            <div class="panel-title">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v14H4z"/><path d="M4 10h16M9 10v9M15 10v9"/></svg>
              <span>存储图表</span>
            </div>
            <div class="panel-actions">
              <button class="help-btn" data-help="chart" title="图表帮助">?</button>
            </div>
          </div>

          <div class="chart-controls">

/* 把示例树整体缩放到该包的真实体积，避免「包 1.8 GB、图里只数出 561 MB」。 */
function scaleNodesTo(arr,totalMb){
  const base=arr.reduce((a,n)=>a+n.mb,0);
  if(!base || !totalMb) return arr;
  const k=totalMb/base;
  if(Math.abs(k-1)<0.001) return arr;
  walk(arr,n=>{ n.mb=Math.max(0,Math.round(n.mb*k)); });
  return arr;
}
function scaledNodes(pkg){
  const t=packageNodes(pkg);
  scaleNodesTo(t.nodes,pkg.mb);
  return t.nodes;
}

function findNode(nodes,id){
  for(const n of nodes){
    if(n.id===id) return n;
    const hit=findNode(n.children||[],id); if(hit) return hit;
  }
  return null;
}
function walk(nodes,fn){ for(const n of nodes){ fn(n); walk(n.children||[],fn); } }
/* 勾选与展开状态按「来源作用域」记忆：宿主一个作用域，每个包一个作用域。
   多张图表（多包 / 多卷）各自带自己的 scope，互不串。 */
function treeKey(scope,id){ return scope+'::'+id; }
function isChecked(n,scope){ const k=treeKey(scope,n.id); return state.sel[k]!==undefined ? state.sel[k] : !!n.checked; }
function setChecked(n,scope,val){ state.sel[treeKey(scope,n.id)]=val; walk(n.children||[],c=>{ state.sel[treeKey(scope,c.id)]=val; }); }
function syncAncestors(nodes,scope){
  for(const n of nodes){
    if(n.children && n.children.length){
      syncAncestors(n.children,scope);
      const vals=n.children.map(c=>isChecked(c,scope));
      const all=vals.every(Boolean), none=vals.every(v=>!v);
      n._indeterminate = !all && !none;
      n._checked = all;
    } else { n._checked = isChecked(n,scope); n._indeterminate=false; }
  }
}
function sumSelected(nodes,scope){
  let mb=0, count=0;
  for(const n of nodes){
    if(n.children && n.children.length){
      const r=sumSelected(n.children,scope); mb+=r.mb; count+=r.count;
    } else if(isChecked(n,scope)){ mb+=n.mb; count++; }
  }
  return { mb, count };
}

/* 分卷要能下钻：某个分类比单卷上限还大时，继续拆到它的子项，
   否则「聊天记录 837 MB」这种节点会整块撑破一条 300 MB 的卷。 */
function splitChunks(nodes,limit,path){
  const out=[];
  for(const n of nodes){
    if(n.mb>limit && n.children && n.children.length){
      out.push(...splitChunks(n.children,limit,path.concat([n])));
    }else{
      out.push({ path, node:n, mb:n.mb });
    }
  }
  return out;
}
/* 把某一卷的碎片重建成一棵完整的树（祖先按需补出来，体积按卷内实际重算）。 */
function buildVolumeTree(chunks){
  const roots=[], idx=new Map();
  for(const c of chunks){
    let container=roots, keyPath='';
    for(const anc of c.path){
      keyPath+='/'+anc.id;
      let hit=idx.get(keyPath);
      if(!hit){ hit={...anc, children:[], mb:0}; idx.set(keyPath,hit); container.push(hit); }
      container=hit.children;
    }
    container.push({...c.node, children:(c.node.children||[]).map(x=>({...x, children:[]}))});
  }
  const recompute=arr=>{
    for(const n of arr){
      if(n.children && n.children.length){
        recompute(n.children);
        n.mb=n.children.reduce((a,c)=>a+c.mb,0);
      }
    }
  };
  recompute(roots);
  return roots;
}
function volumesOf(pkg,nodes){
  const total=pkg.mb||0, limit=splitLimit();
  if(!limit || total<=limit) return [{i:1,n:1,mb:total,nodes}];
  const chunks=splitChunks(nodes,limit,[]);
  const buckets=[];
  let cur={mb:0,chunks:[]};
  for(const c of chunks){
    // 0 字节节点不单独开卷（否则会多出一张空图表）
    if(cur.chunks.length && c.mb>0 && cur.mb+c.mb>limit){ buckets.push(cur); cur={mb:0,chunks:[]}; }
    cur.chunks.push(c); cur.mb+=c.mb;
  }
  if(cur.chunks.length) buckets.push(cur);
  return buckets.map((b,i)=>({ i:i+1, n:buckets.length, mb:Math.round(b.mb), nodes:buildVolumeTree(b.chunks),
    over: b.mb>limit+0.5 }));
}

function renderTreeRows(nodes,depth,scope,readonly){
  let out='';
  for(const n of nodes){
    const key=treeKey(scope,n.id);
    const expanded=state.expanded[key]!==undefined ? state.expanded[key] : !!n.expanded;
    const hasKids=n.children && n.children.length;
    const checked = hasKids ? !!n._checked : isChecked(n,scope);
    const indeterminate = hasKids && !!n._indeterminate;
    const ind=Math.min(depth,8)*15;
    const pillCls=n.suggest==='keep'?'keep':n.suggest==='optional'?'optional':n.suggest==='drop'?'drop':'unknown';
    const pillText=n.suggest==='keep'?'建议保留':n.suggest==='optional'?'可选':n.suggest==='drop'?'建议清理':'未识别';
    out+='<div class="tree-row'+(expanded?' expanded':'')+'" data-id="'+n.id+'" style="padding-left:'+(6+ind)+'px">'
      +'<button class="tree-toggle'+(hasKids?'':' empty')+'" data-node="'+n.id+'" aria-label="展开">'
      +'<svg class="chev" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>'
      +'<input class="tree-check" type="checkbox" data-check="'+n.id+'"'+(checked?' checked':'')+(indeterminate?' data-ind="1"':'')+(readonly?' disabled':'')+'>'
      +svg(n.icon,'tree-ico')
      +'<span class="tree-label" title="'+n.label+'">'+n.label+(n.badge?'<span class="sub">'+n.badge+'</span>':'')+(n.note?'<span class="sub">'+n.note+'</span>':'')+'</span>'
      +'<span class="tree-pill '+pillCls+'">'+pillText+'</span>'
      +'<span class="tree-size">'+fmtMB(n.mb)+'</span>'
      +(n.uploadable?'<button class="tree-mini" data-upload="'+n.id+'">上传</button>':'')
      +'</div>';
    if(hasKids && expanded){
      out+='<div class="tree-children">'+renderTreeRows(n.children,depth+1,scope,readonly)+'</div>';
    }
  }
  return out;
}

/* 一张标准图表卡：卷号 + 本卷容量 + 工具条 + 树 + 勾选摘要。
   勾选/展开状态按 scope 记忆，所以多包多卷各改各的、互不串。 */
function chartCardHtml(o){

    +(o.hideHead?'':'<div class="vol-head">'

      +(o.capText?'<span class="vol-cap'+(o.over?' is-over':'')+'">'+o.capText+'</span>':'')
      +(o.over?'<span class="vol-flag">超单卷上限</span>':'')
      +'<span class="vol-spacer"></span>'
      +(o.totalText?'<span class="vol-total">'+o.totalText+'</span>':'')
      +'<button class="vol-collapse" data-voltoggle="'+o.key+'" aria-label="展开或收起">'
      +'<svg class="chev" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>'
    +'</div>')
    +'<div class="vol-body">'
      +(o.noticeHtml||'')
      +'<div class="tree-tools">'
        +'<button data-treeall="1">全选</button>'
        +'<button data-treenone="1">全不选</button>'
        +'<button data-treeinvert="1">反选</button>'
        +'<span class="spacer"></span><span class="hint">大类折叠到文件</span>'

      +'<div class="chart-foot"><span>已选 '+sum.count+' 项 · 预计 '+fmtMB(sum.mb)+'</span></div>'
    +'</div>'
  +'</div>';
}

function renderChart(){

  const scroll=stack.scrollTop;
  let html='';

      html+='<div class="chart-group">'
        +'<div class="vol-grid" data-vols="1">'+chartCardHtml({
            key:'host', scope:'host:'+state.host, nodes:tree.nodes, idxText:'宿主数据',
            noticeHtml: degraded ? '<div class="chart-unavailable"><b>当前形态没有存储清单端点</b><br>宿主图表置灰；下方仍可查看插件自身数据。不新增该宿主专用后端。</div>' : '',
            readonly:false
          })+'</div></div>';
      return;
    }
    const pkg=t.pkg;

    html+='<div class="chart-group">'
      +'<div class="chart-group-head">'
        +'<span class="g-name">'+seqLabel(pkg)+'</span>'

function renderFilenamePreview(){
  const input=document.getElementById('filename-template');
  const out=document.getElementById('filename-preview');
  if(!input||!out) return;
  const tpl=input.value||'{target}_{user}_{part}_{datetime}.zip';
  const now=new Date(); const p=n=>String(n).padStart(2,'0');
  const dt=now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate())+'_'+p(now.getHours())+'-'+p(now.getMinutes())+'-'+p(now.getSeconds());
  const map={
    '{host}':HOSTS[state.host].full,
    '{target}':state.target,
    '{user}':'default-user',
    '{part}':'part1',
    '{date}':dt.slice(0,10),
    '{time}':dt.slice(11),
    '{datetime}':dt,
    '{mode}':'full',
    '{category}':'all',
    '{source}':'archive',
    '{count}':'0'
  };
  let name=tpl;
  Object.keys(map).forEach(k=>{ name=name.split(k).join(map[k]); });
  name=name.replace(/[<>:"/\\|?*\x00-\x1f]/g,'_');
  if(!/\.zip$/i.test(name)) name+='.zip';
  out.textContent=name;
  out.title=name;
}

function pkgCard(p){
  const isActive=state.source.type==='package' && state.source.pkgId===p.id;
  const isMobile=state.view==='mobile';
  const hostKey=p.unrecognized?'unknown':p.host;
  const hostCode=p.unrecognized?'?':({st:'ST',luker:'L',tt:'TT',pt:'PT'}[p.host]||'?');
  const brand=p.unrecognized?null:({st:'--brand-st',luker:'--brand-luker',tt:'--brand-tt',pt:'--brand-pt'}[p.host]||null);
  const tagStyle=brand
    ? 'background:var('+brand+');color:var('+brand+'-ink);border-color:transparent'
    : 'color:var(--unknown);border-color:var(--unknown)';
  const seqStyle=brand
    ? 'color:var('+brand+'-ring);border-color:var('+brand+'-ring)'
    : 'color:var(--unknown);border-color:var(--unknown)';
  const iconInner=p.unrecognized
    ? '<span class="pkg-icon" data-host="unknown" style="display:inline-flex;align-items:center;justify-content:center;color:var(--unknown)">'+svg('unknown','tree-ico')+'</span>'
    : '<img class="pkg-icon" data-host="'+hostKey+'" src="'+hostIcon(p.host)+'" alt="'+hostName(p.host)+'">';
  const icon='<span class="pkg-icon-wrap">'
    +'<span class="pkg-seq" style="'+seqStyle+'">'+seqNum(p)+'</span>'
    +iconInner+'<span class="pkg-host-tag" style="'+tagStyle+'">'+hostCode+'</span></span>';
  const badges=[];
  if(p.unrecognized) badges.push('<span class="pkg-badge unknown">未识别包</span>');
  const limit=splitLimit();
  if(limit && (p.mb||0)>limit) badges.push('<span class="pkg-badge warn">分卷 '+Math.ceil(p.mb/limit)+'</span>');
  if(p.zone==='export') badges.push('<span class="pkg-badge lock">只读</span>');
  if(p.origin) badges.push('<span class="pkg-badge">'+p.origin+'</span>');
  return '<div class="pkg-card'+(isActive?' is-active':'')+(p.unrecognized?' unrecognized':'')+(p.zone==='export'?' is-export':'')+'" data-pkg="'+p.id+'" data-mobile="'+(isMobile?'1':'0')+'">'
    +'<input class="pkg-check" type="checkbox" data-pkgcheck="'+p.id+'"'+(state.selectedPkgs.has(p.id)?' checked':'')+'>'
    +icon
    +'<div class="pkg-info">'
    +'<div class="pkg-name"><span class="pkg-name-txt" data-fullname="'+encodeURIComponent(p.name)+'" title="'+p.name+'">'+p.name+'</span></div>'
    +'<div class="pkg-meta">'+badges.join('')+'<span>'+p.size+'</span><span>'+p.time+'</span></div>'
    +'</div>'
    +'<div class="pkg-actions">'
    +(p.zone==='export'
      ? '<button data-pkgact="download" data-id="'+p.id+'" title="下载">'+svg('file','tree-ico')+'</button>'
        +'<button data-pkgact="upload" data-id="'+p.id+'" title="回传宿主">'+svg('cloud','tree-ico')+'</button>'
        +'<button data-pkgact="copyback" data-id="'+p.id+'" title="复制回导入区">'+svg('folder','tree-ico')+'</button>'
      : '<button data-pkgact="delete" data-id="'+p.id+'" title="删除">'+svg('archive','tree-ico')+'</button>')
    +'</div></div>';
}

/* 包名换行判定：只有当整名除以可用宽度的小数部分够满（≥45%）才允许折成两行，
   否则宁可单行省略 —— 免得第二行只剩「.zip」这种残句。 */
function fitPackageNames(){
  const cv=fitPackageNames._cv||(fitPackageNames._cv=document.createElement('canvas'));
  const ctx=cv.getContext('2d');
  document.querySelectorAll('.pkg-name-txt').forEach(el=>{
    const full=decodeURIComponent(el.dataset.fullname||'')||el.textContent;
    const cs=getComputedStyle(el);
    ctx.font=cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
    const need=ctx.measureText(full).width;
    const avail=el.clientWidth||1;
    const lines=need/avail;
    el.classList.toggle('two-line', lines>1.05 && (lines%1)>=0.45);
  });
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── 动作 ── */
function doFetch(){
  log('INFO','向宿主 '+HOSTS[state.host].full+' 请求数据包');
  const id='p'+Date.now();
  const pkg={ id, zone:'import', host:state.host, name:HOSTS[state.host].full+'_host-export_'+dtNow()+'.zip', size:'1.2 GB', mb:1200, ts:Date.now(), time:'10-26 '+nowTime().slice(0,5), origin:'宿主导出' };
  state.packages.push(pkg);
  log('INFO','宿主拉取完成: '+pkg.name);
  log('INFO','宿主存储读数已加载 · '+HOSTS[state.host].full);
  renderZones(); renderActions(); toast('宿主拉取完成');
}
function doGenerate(){
  const ids=[...state.selectedPkgs];
  if(ids.length===0){ toast('先选择要导出的包'); return; }
  const pkgs=ids.map(id=>state.packages.find(p=>p.id===id)).filter(Boolean);
  const bad=pkgs.find(p=>p.unrecognized);
  if(bad){ toast('未识别包只允许存储或导出，不提供转换'); return; }
  const targetKey = state.target==='SillyTavern' ? 'st' : state.target==='Luker' ? 'luker' : state.target==='TauriTavern' ? 'tt' : 'pt';
  const dt=dtNow(), stamp=Date.now(), t='10-26 '+nowTime().slice(0,5);
  const made=[];
  pkgs.forEach((pkg,pi)=>{
    // 每卷都是一个可独立导入的合法包，所以分卷后导出区会出现 N 个包，而不是一个「带分卷标记」的包
    const vols=volumesOf(pkg,scaledNodes(pkg));
    vols.forEach((v,i)=>{
      made.push({
        id:'e'+stamp+'_'+pi+'_'+i, zone:'export', host:targetKey,
        name:state.target+'_default-user_part'+(i+1)+'_'+dt+'.zip',
        size:fmtMB(v.mb), mb:Math.round(v.mb), ts:stamp+i,
        time:t, origin:'导出副本', readonly:true
      });
    });
    log('INFO','生成导出包: '+pkg.name+' → '+vols.length+' 个');
  });
  state.packages.push(...made);
  log('INFO','已生成导出副本（解耦）共 '+made.length+' 个');
  state.zone='export'; state.selectedPkgs=new Set(made.map(m=>m.id));
  renderZones(); renderActions(); renderChart();
  setProgress(100,'导出包已就绪');
  toast('已生成 '+made.length+' 个导出包');
}
function doMerge(){
  if(state.selectedPkgs.size<2){ toast('至少选择两个包'); return; }
  const names=[...state.selectedPkgs].map(id=>state.packages.find(p=>p.id===id)?.name).filter(Boolean);
  log('WARN','合并上传检测到同名路径: characters/Seraphina.png');
  openModal('合并冲突','以下路径在多个包中同名，已停止合并。请先在本地编辑或改名。',[
    '<div class="chart-unavailable" style="margin:0">'+names.join('<br>')+'<br><br>冲突: characters/Seraphina.png</div>'
  ],[{label:'知道了',primary:true,onClick:closeModal}]);
}
function doUploadHost(){
  if(state.selectedPkgs.size===0){ toast('先选择要回传的包'); return; }
  openTrafficModal(()=>{
    log('INFO','向宿主 '+HOSTS[state.host].full+' 上传 '+state.selectedPkgs.size+' 个包');
    toast('已开始上传到宿主');
  });
}
function doCopyBack(){
  const ids=[...state.selectedPkgs];
  let n=0;
  for(const id of ids){
    const pkg=state.packages.find(p=>p.id===id);
    if(!pkg || pkg.zone!=='export') continue;
    const copy={...pkg, id:'p'+Date.now()+'_'+n, zone:'import', origin:'导出副本', readonly:false, ts:Date.now(), time:'10-26 '+nowTime().slice(0,5)};
    state.packages.push(copy); n++;
  }
  log('INFO','已复制 '+n+' 个包回导入区');
  state.zone='import'; state.selectedPkgs=new Set();
  renderZones(); renderActions(); toast('已复制回导入区');
}
function doDeleteSelected(){
  if(state.selectedPkgs.size===0){ toast('先选择要删除的包'); return; }
  openModal('删除数据包','确定删除选中的 '+state.selectedPkgs.size+' 个包吗？此操作不可撤销。',[],[
    {label:'取消',onClick:closeModal},
    {label:'删除',primary:true,danger:true,onClick:()=>{
      const ids=[...state.selectedPkgs];
      state.packages=state.packages.filter(p=>!state.selectedPkgs.has(p.id));
      state.selectedPkgs=new Set();
      if(state.source.type==='package' && ids.includes(state.source.pkgId)){
        state.source={type:'host',pkgId:null}; state.sourceKey='host:'+state.host;
      }
      log('INFO','已删除 '+ids.length+' 个包');
      closeModal(); renderZones(); renderActions(); renderChart(); toast('已删除');
    }}
  ]);
}
function doUploadPrivate(name){
  openTrafficModal(()=>{

    toast('私有配置已上传到 user/files');
  });
}

  document.getElementById('zone-tabs').addEventListener('click',e=>{
    const b=e.target.closest('.zone-tab'); if(!b) return;
    state.zone=b.dataset.zone; state.selectedPkgs=new Set();
    renderZones(); renderActions();
  });

  const targetBtn=document.getElementById('target-btn');
  const targetPop=document.getElementById('target-pop');
  const closeTargetPop=()=>{ targetPop.hidden=true; targetBtn.setAttribute('aria-expanded','false'); };
  targetBtn.addEventListener('click',e=>{
    e.stopPropagation();
    const willOpen=targetPop.hidden;
    targetPop.hidden=!willOpen;
    targetBtn.setAttribute('aria-expanded',String(willOpen));
  });
  targetPop.addEventListener('click',e=>{
    const it=e.target.closest('[data-target]'); if(!it) return;
    state.target=it.dataset.target;
    closeTargetPop(); renderTargetPicker(); renderChart();
    log('INFO','目标平台切换为 '+state.target);
  });
  document.addEventListener('click',e=>{
    if(!targetPop.hidden && !e.target.closest('#target-select')) closeTargetPop();
  });
  document.getElementById('delta-toggle').addEventListener('click',e=>{
    const b=e.target.closest('button[data-delta]'); if(!b) return;
    document.querySelectorAll('#delta-toggle button').forEach(x=>x.classList.toggle('active',x===b));
    state.delta=b.dataset.delta; log('INFO','导出方式: '+(state.delta==='overwrite'?'覆盖':'增量'));
  });
  const splitInput=document.getElementById('split-input');
  splitInput.addEventListener('input',e=>{
    state.splitMb=e.target.value;
    renderChart();
  });
  splitInput.addEventListener('change',e=>{
    const raw=Number(e.target.value);
    if(e.target.value===''||!isFinite(raw)) return;
    const clamped=Math.min(SPLIT_MAX,Math.max(SPLIT_MIN,Math.round(raw)));
    if(clamped!==raw){
      e.target.value=clamped; state.splitMb=String(clamped);
      renderChart(); toast('单卷容量限定 '+SPLIT_MIN+'–'+SPLIT_MAX+' MB');
    }
  });
  document.getElementById('filename-template').addEventListener('input',renderFilenamePreview);

  const stackEl=document.getElementById('chart-stack');
  const scopeFromEl=el=>{ const h=el.closest('[data-scope]'); return h?h.dataset.scope:null; };
  const nodesForScope=scope=>{
    if(scope && scope.indexOf('pkg:')===0){
      const p=state.packages.find(x=>x.id===scope.slice(4));
      return p ? packageNodes(p).nodes : [];
    }
    return hostNodes(state.host).nodes;
  };
  const applyTreeAll=(scope,mode,quiet)=>{
    walk(nodesForScope(scope),n=>{
      if(!n.children || !n.children.length){
        const cur=isChecked(n,scope);
        state.sel[treeKey(scope,n.id)] = mode==='all' ? true : mode==='none' ? false : !cur;
      }
    });
    if(!quiet) renderChart();
  };
  const closeGroup=(id)=>{
    state.selectedPkgs.delete(id);
    if(state.source.type==='package' && state.source.pkgId===id) state.source={type:'host',pkgId:null};
    renderChart(); renderZones(); renderActions();
  };

  stackEl.addEventListener('click',e=>{
    const bulk=e.target.closest('[data-treeall],[data-treenone],[data-treeinvert]');
    if(bulk){
      const scope=scopeFromEl(bulk); if(!scope) return;
      applyTreeAll(scope, bulk.dataset.treeall?'all':bulk.dataset.treenone?'none':'invert');
      return;
    }
    const vol=e.target.closest('[data-voltoggle]');
    if(vol){ const k=vol.dataset.voltoggle; state.collapsedVol[k]=!state.collapsedVol[k]; renderChart(); return; }
    const close=e.target.closest('[data-closegroup]');
    if(close){ closeGroup(close.dataset.closegroup); return; }
    const t=e.target.closest('[data-node]');
    if(t){
      const scope=scopeFromEl(t); if(!scope) return;
      const id=t.dataset.node, key=treeKey(scope,id);
      const row=t.closest('.tree-row');
      state.expanded[key]=state.expanded[key]!==undefined ? !state.expanded[key] : !row.classList.contains('expanded');
      renderChart(); return;
    }
    const up=e.target.closest('[data-upload]');
    if(up){
      const n=findNode(nodesForScope(scopeFromEl(up)),up.dataset.upload);
      doUploadPrivate(n?n.label:''); return;
    }
  });
  stackEl.addEventListener('change',e=>{
    const cb=e.target.closest('[data-check]'); if(!cb) return;
    const scope=scopeFromEl(cb); if(!scope) return;
    const n=findNode(nodesForScope(scope),cb.dataset.check); if(!n) return;
    setChecked(n,scope,cb.checked); renderChart();
  });
  document.getElementById('batch-bar').addEventListener('click',e=>{
    const b=e.target.closest('[data-batchall],[data-batchnone],[data-batchinvert]'); if(!b) return;
    const mode=b.dataset.batchall?'all':b.dataset.batchnone?'none':'invert';
    const pkgs=chartTargets().filter(t=>t.pkg);
    pkgs.forEach(t=>applyTreeAll('pkg:'+t.pkg.id,mode,true));
    renderChart(); renderZones();
    log('INFO','批量'+(mode==='all'?'全选':mode==='none'?'全不选':'反选')+'：'+pkgs.length+' 个包');
  });

  document.getElementById('zone-card').addEventListener('click',e=>{
    const check=e.target.closest('[data-pkgcheck]');
    if(check){
      const id=check.dataset.pkgcheck;
      if(check.checked) state.selectedPkgs.add(id); else state.selectedPkgs.delete(id);
      renderZones(); renderActions(); return;
    }
    const act=e.target.closest('[data-pkgact]');
    if(act){
      const id=act.dataset.id; const pkg=state.packages.find(p=>p.id===id); if(!pkg) return;
      const kind=act.dataset.pkgact;
      if(kind==='delete'){
        state.selectedPkgs=new Set([id]); doDeleteSelected();
      }else if(kind==='download'){
        log('INFO','已下载 '+pkg.name); toast('已开始下载');
      }else if(kind==='upload'){
        state.selectedPkgs=new Set([id]); doUploadHost();
      }else if(kind==='copyback'){
        state.selectedPkgs=new Set([id]); doCopyBack();
      }
      return;
    }
    const name=e.target.closest('[data-fullname]');
    if(name && (state.view==='mobile' || window.innerWidth<=860)){ e.stopPropagation(); showFullName(name); return; }
    const card=e.target.closest('[data-pkg]');
    if(card && !e.target.closest('input')){
      const id=card.dataset.pkg;
      state.selectedPkgs=new Set();          // 点卡 = 聚焦单包；批量只走勾选框
      state.source={type:'package',pkgId:id}; state.sourceKey='pkg:'+id;
      renderChart(); renderZones(); renderActions(); toast('图表已切换到该包');
    }
  });

  const logOverlay=document.getElementById('log-overlay');
  document.getElementById('btn-log').addEventListener('click',()=>{ renderLog(); logOverlay.classList.add('open'); });
  document.getElementById('log-close').addEventListener('click',()=>logOverlay.classList.remove('open'));
  logOverlay.addEventListener('click',e=>{ if(e.target===logOverlay) logOverlay.classList.remove('open'); });
  document.getElementById('log-toolbar').addEventListener('click',e=>{
    const b=e.target.closest('[data-level]'); if(!b) return;
    document.querySelectorAll('#log-toolbar [data-level]').forEach(x=>x.classList.toggle('active',x===b));
    state.logLevel=b.dataset.level; renderLog();
  });
  document.getElementById('log-clear').addEventListener('click',()=>{ state.log=[]; renderLog(); });
  document.getElementById('log-copy').addEventListener('click',()=>{
    const txt=state.log.map(l=>'['+l.time+'] ['+l.level+'] '+l.msg).join('\n');
    navigator.clipboard?.writeText(txt).then(()=>toast('日志已复制')).catch(()=>toast('复制失败'));
  });

  document.getElementById('modal-overlay').addEventListener('click',e=>{ if(e.target.id==='modal-overlay') closeModal(); });
  document.getElementById('tutorial-skip').addEventListener('click',closeTutorial);
  document.getElementById('tutorial-prev').addEventListener('click',()=>{ if(state.tutorialStep>0){ state.tutorialStep--; renderTutorial(); } });
  document.getElementById('tutorial-next').addEventListener('click',()=>{
    const set=tutorialSet();
    if(state.tutorialStep>=set.length-1){ closeTutorial(); toast('教程完成'); }
    else{ state.tutorialStep++; renderTutorial(); }
  });
  document.getElementById('tutorial-adv').addEventListener('click',()=>{
    state.tutorialKind = state.tutorialKind==='adv' ? 'basic' : 'adv';
    state.tutorialStep=0; renderTutorial();
  });
  window.addEventListener('resize',()=>{ if(state.tutorialOpen) renderTutorial(); closeHelp(); fitPackageNames(); });
}

/* ── 桌面拖拽分隔条 ── */
function initSplitters(){
  const main=document.querySelector('.app-main');
  const sv=document.getElementById('split-v');
  if(sv && main){
    let on=false;
    sv.addEventListener('pointerdown',e=>{
      on=true; sv.classList.add('is-dragging'); sv.setPointerCapture(e.pointerId);
      document.body.style.cursor='col-resize'; e.preventDefault();
    });
    sv.addEventListener('pointermove',e=>{
      if(!on) return;
      const r=main.getBoundingClientRect();
      let pct=((e.clientX-r.left)/r.width)*100;
      pct=Math.max(30,Math.min(80,pct));
      main.style.setProperty('--split-left',pct.toFixed(2)+'%');
    });
    const stop=()=>{ on=false; sv.classList.remove('is-dragging'); document.body.style.cursor=''; };
    sv.addEventListener('pointerup',stop); sv.addEventListener('pointercancel',stop);
  }
  const side=document.querySelector('.col-side');
  const sh=document.getElementById('split-h');
  if(sh && side){
    let on=false;
    sh.addEventListener('pointerdown',e=>{
      on=true; sh.classList.add('is-dragging'); sh.setPointerCapture(e.pointerId);
      document.body.style.cursor='row-resize'; e.preventDefault();
    });
    sh.addEventListener('pointermove',e=>{
      if(!on) return;
      const r=side.getBoundingClientRect();
      let h=e.clientY-r.top;
      h=Math.max(150,Math.min(r.height-170,h));
      side.style.setProperty('--zone-h',h.toFixed(0)+'px');
    });
    const stop=()=>{ on=false; sh.classList.remove('is-dragging'); document.body.style.cursor=''; };
    sh.addEventListener('pointerup',stop); sh.addEventListener('pointercancel',stop);
  }
  // 交叉点：一次拖动同时改列宽与上下高度
  const corner=document.getElementById('split-corner');
  if(corner && main && side){
    let on=false, mainRect=null, sideTop=0, sideH=0;
    corner.addEventListener('pointerdown',e=>{
      on=true; corner.classList.add('is-dragging'); corner.setPointerCapture(e.pointerId);
      mainRect=main.getBoundingClientRect();
      const sr=side.getBoundingClientRect(); sideTop=sr.top; sideH=sr.height;
      document.body.style.cursor='move'; e.preventDefault(); e.stopPropagation();
    });
    corner.addEventListener('pointermove',e=>{
      if(!on) return;
      let pct=((e.clientX-mainRect.left)/mainRect.width)*100;
      pct=Math.max(30,Math.min(80,pct));
      main.style.setProperty('--split-left',pct.toFixed(2)+'%');
      let h=e.clientY-sideTop;
      h=Math.max(150,Math.min(sideH-170,h));
      side.style.setProperty('--zone-h',h.toFixed(0)+'px');
    });
    const stop=()=>{ on=false; corner.classList.remove('is-dragging'); document.body.style.cursor=''; };
    corner.addEventListener('pointerup',stop); corner.addEventListener('pointercancel',stop);
  }
}

/* ── 重置 ── */
function resetDemo(){
  state.packages=INITIAL_PACKAGES.map(p=>({...p}));
  state.selectedPkgs=new Set(); state.expanded={}; state.collapsedVol={}; state.sel={}; state.log=[];
  state.zone='import'; state.source={type:'host',pkgId:null}; state.target='SillyTavern';
  state.delta='overwrite'; state.splitMb=''; state.host='luker'; state.mode='plugin';
  state.view='desktop'; state.theme='dark'; state.tutorialKind='basic';
  state.noTrafficPrompt=false; state.keepExport=true; state.autoTutorial=true; state.filter='all'; state.sourceKey='host:luker';
  document.getElementById('app').dataset.host='luker';
  document.getElementById('app').dataset.view='desktop';
  document.documentElement.dataset.theme='dark';
  document.getElementById('split-input').value='';
  document.querySelector('.app-main').style.removeProperty('--split-left');
  document.querySelector('.col-side').style.removeProperty('--zone-h');
  document.querySelectorAll('#demo-host button').forEach(x=>x.classList.toggle('active',x.dataset.host==='luker'));
  document.querySelectorAll('#demo-mode button').forEach(x=>x.classList.toggle('active',x.dataset.mode==='plugin'));
  document.querySelectorAll('#demo-view button').forEach(x=>x.classList.toggle('active',x.dataset.view==='desktop'));
  document.querySelectorAll('#demo-theme button').forEach(x=>x.classList.toggle('active',x.dataset.theme==='dark'));
  renderHeader(); renderChart(); renderZones(); renderActions(); renderLog();
  setProgress(0,'准备就绪');
  toast('已重置');
}
